name: Preview cleanup

# A closed pull request gives back what its preview held: the free plans
# allow about nine previews at once (docs/deploy.md).
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    # Cancels a preview still deploying, so nothing it creates outlives this.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Delete the preview
        working-directory: apps/cloudflare
        # A pull request closed before its first preview has none. A preview
        # left behind costs nothing: Cloudflare drops the oldest past 100.
        continue-on-error: true
        run: pnpm exec wrangler preview delete --name "$PREVIEW" --skip-confirmation
      - name: Delete its Hyperdrive config
        if: ${{ !cancelled() }}
        working-directory: apps/cloudflare
        run: node scripts/hyperdrive.mjs delete "fox-renard-$PREVIEW"
      - name: Delete its Neon branch
        if: ${{ !cancelled() }}
        # https://api-docs.neon.tech/reference/listprojectbranches
        run: |
          branches="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          id="$(curl --fail --silent --show-error --header "Authorization: Bearer $NEON_API_KEY" "$branches?search=$PREVIEW" \
            | jq -r --arg name "$PREVIEW" '.branches[] | select(.name == $name) | .id')"
          if [ -z "$id" ]; then
            echo "No Neon branch is named $PREVIEW."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null --request DELETE --header "Authorization: Bearer $NEON_API_KEY" "$branches/$id"
          echo "Deleted the Neon branch $PREVIEW."
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
